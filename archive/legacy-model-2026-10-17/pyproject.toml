[project]
name = "cda-decision-support"
version = "0.1.0"
description = "商海之弈（CESIM Marketing 手机案例）回合制经营决策支持工具：可迁移、平台无关、人类在环"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "pydantic>=2",
    "PyYAML",
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
