# ============================================================
# 决策表单 schema —— 已从 results-ir00.xls 反推真实决策变量
# 精确字段名/单位/范围以「决策指南.pdf」（36 页）为准，此处为反推的变量清单。
# lower/upper/default 填 null 表示 [待验证]。
# 注意：真实决策是「多产品」结构（每个产品有自己的价格/特性/款式），
#       本文件暂用扁平代表字段，多产品展开待读决策指南后扩展。
# ============================================================
markets: [EU, ASIA]
segments: [consumer, premium, business, premium_business]

fields:
  # 产品数量：结果文件显示各公司提供 1~5 个产品（P1~P6）
  n_products:
    name: n_products
    unit: "个"
    kind: integer
    lower: 0
    upper: 6
    default: null
    applies_to: []

  # 定价（真实为「每产品 × 每市场」，此处为代表字段）
  price_EU:
    name: price_EU
    unit: "EUR"
    kind: continuous
    lower: null
    upper: null
    default: null
    applies_to: [EU]

  price_ASIA:
    name: price_ASIA
    unit: "EUR"
    kind: continuous
    lower: null
    upper: null
    default: null
    applies_to: [ASIA]

  # 广告费（分市场）
  advertising_EU:
    name: advertising_EU
    unit: "千元"
    kind: continuous
    lower: 0
    upper: null
    default: null
    applies_to: [EU]

  advertising_ASIA:
    name: advertising_ASIA
    unit: "千元"
    kind: continuous
    lower: 0
    upper: null
    default: null
    applies_to: [ASIA]

  # 渠道投资（分市场；渠道=品牌专卖店/家电卖场/百货商场）
  channel_investment_EU:
    name: channel_investment_EU
    unit: "千元"
    kind: continuous
    lower: 0
    upper: null
    default: null
    applies_to: [EU]

  channel_investment_ASIA:
    name: channel_investment_ASIA
    unit: "千元"
    kind: continuous
    lower: 0
    upper: null
    default: null
    applies_to: [ASIA]

  # 研发投资（分属性：性能 / 电池寿命；跨年累积效应）
  # 注意：填的是钱（千€），不是属性值；练习回合可适度，正式回合别砍到底（股价受研发影响）
  rd_performance:
    name: rd_performance
    unit: "千€"
    kind: continuous
    lower: 0
    upper: null
    default: null
    applies_to: []

  rd_battery:
    name: rd_battery
    unit: "千€"
    kind: continuous
    lower: 0
    upper: null
    default: null
    applies_to: []

  # 客户服务：额外质保期限（单位是「月」，市场平均 12 个月，低于 12 会扣需求）
  warranty_months:
    name: warranty_months
    unit: "月"
    kind: integer
    lower: 6
    upper: 60
    default: 12
    applies_to: []

  # 市场调研投入（结果文件显示为 600 / 1200 两档）
  market_research:
    name: market_research
    unit: "千元"
    kind: categorical
    lower: null
    upper: null
    default: null
    applies_to: []

  # 生产线成本（结果文件显示 6600 / 8800 / 11000 三档）
  production_line_cost:
    name: production_line_cost
    unit: "千元"
    kind: categorical
    lower: null
    upper: null
    default: null
    applies_to: []

  # 销售预测（分市场；驱动生产，预测误差有成本——见「销售预测误差」指标）
  sales_forecast_EU:
    name: sales_forecast_EU
    unit: "千件"
    kind: continuous
    lower: 0
    upper: null
    default: null
    applies_to: [EU]

  sales_forecast_ASIA:
    name: sales_forecast_ASIA
    unit: "千件"
    kind: continuous
    lower: 0
    upper: null
    default: null
    applies_to: [ASIA]
